spring:
  application:
    name: api-registry
  datasource:
    url: jdbc:postgresql://localhost:5432/registry
    username: registry
    password: registry
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
